    <body class="d-flex flex-column">
        <a class="skip-link" href="#main">Skip to content</a>
        <main class="flex-shrink-0">
            <!-- Navigation-->
            <header class="site-bar"><nav class="navbar navbar-expand-lg navbar-dark"><div class="container px-4"><a class="navbar-brand" href="index.html">Iyad Mahdy</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarSupportedContent"><ul class="navbar-nav ms-auto mb-2 mb-lg-0"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li><li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li></ul></div></div></nav></header>
            <div id="main" tabindex="-1"></div>
            <!-- Page content-->
            <section class="py-5">
                <div class="container px-5">
                    <!-- Contact form-->
                    <div class="bg-light rounded-4 py-5 px-4 px-md-5">
                        <div class="text-center mb-5">
                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i class="bi bi-envelope"></i></div>
                            <h1 class="fw-bolder">Get in touch</h1>
                            <p class="lead fw-normal text-muted mb-0">Let's work together!</p>
                        </div>
                        <div class="row gx-5 justify-content-center">
                            <div class="col-lg-8 col-xl-6">
                                <!-- * * SB Forms Contact Form * *-->
                                <div class="alert alert-success" role="status" id="sent" hidden>Thanks! Your message was sent. I will reply soon.</div>
                                <form action="https://formspree.io/f/xzzawglr" method="POST">
                                    <!-- Name input-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="name" type="text" name="name" placeholder="Enter your name..." required />
                                        <label for="name">Full name</label>
                                    </div>

                                    <!-- Email address input-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="email" type="email" name="email" placeholder="name@example.com" required />
                                        <label for="email">Email address</label>
                                    </div>

                                    <!-- Message input-->
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" id="message" name="message" placeholder="Enter your message here..." style="height: 10rem" required></textarea>
                                        <label for="message">Message</label>
                                    </div>

                                    <!-- Hidden subject line (optional) -->
                                    <input type="hidden" name="_subject" value="New contact from portfolio site">
                                    <input type="hidden" name="_next" value="https://iyadmahdy.github.io/contact.html?sent">

                                    <!-- Submit Button-->
                                    <div class="d-grid">
                                        <button class="btn btn-primary btn-lg" type="submit">Send Message</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
